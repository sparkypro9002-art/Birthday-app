<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Remindr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-core: #0a0c10;
  --panel: rgba(22, 27, 34, 0.72);
  --panel-border: rgba(255, 255, 255, 0.08);
  --accent-pink: #ec4899;
  --accent-purple: #8b5cf6;
  --accent-cyan: #06b6d4;
  --text-main: #f3f4f6;
  --text-dim: #94a3b8;
  --glow: 0 8px 32px 0 rgba(0, 0, 0, 0.42);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background-color: var(--bg-core);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Dynamic Ambient Glow Gradients */
.ambient {
  position: fixed;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  filter: blur(95px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.45;
  animation: floatOrb 12s ease-in-out infinite alternate;
}
.ambient-1 { background: radial-gradient(circle, var(--accent-purple), transparent 70%); top: -80px; left: -80px; }
.ambient-2 { background: radial-gradient(circle, var(--accent-pink), transparent 70%); bottom: -80px; right: -80px; animation-delay: -6s; }

@keyframes floatOrb {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(40px, 60px) scale(1.15); }
}

.app {
  max-width: 600px;
  margin: auto;
  padding: 24px 18px calc(140px + env(safe-area-inset-bottom, 0px));
  position: relative;
  z-index: 1;
}

/* Header */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.brand-box {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 4px 20px rgba(236, 72, 153, 0.35);
}
h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(180deg, #ffffff 40%, #cbd5e1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sub {
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.3px;
}

.icon-btn-top {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--panel-border);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(12px);
  cursor: pointer;
  transition: all 0.2s ease;
}
.icon-btn-top:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.1); }

/* Navigation Tab Pill */
.nav-pill-container {
  display: flex;
  background: rgba(255, 255, 255, 0.03);
  padding: 5px;
  border-radius: 18px;
  border: 1px solid var(--panel-border);
  margin-bottom: 24px;
  backdrop-filter: blur(20px);
}
.tab-btn {
  flex: 1;
  padding: 10px 0;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  border-radius: 13px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.tab-btn.active {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
  color: #fff;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.12);
}

/* Cards & Feeds */
.card-entry {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  backdrop-filter: blur(20px);
  box-shadow: var(--glow);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, border-color 0.2s ease;
}
.card-entry::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
}
.card-entry:active { transform: scale(0.985); }

/* Avatar / Media Box */
.avatar-wrap {
  width: 68px;
  height: 82px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
}
.avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
.avatar-placeholder { font-size: 26px; opacity: 0.6; }

/* Info Section */
.entry-info { flex: 1; min-width: 0; }
.entry-name {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}
.entry-meta {
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}

/* Dynamic Days Badge */
.countdown-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(139, 92, 246, 0.12);
  color: #c4b5fd;
  border: 1px solid rgba(139, 92, 246, 0.25);
}
.countdown-pill.today {
  background: rgba(236, 72, 153, 0.18);
  color: #f472b6;
  border: 1px solid rgba(236, 72, 153, 0.4);
  animation: pulseToday 2s infinite;
}
@keyframes pulseToday {
  0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.4); }
  50% { box-shadow: 0 0 0 8px rgba(236, 72, 153, 0); }
}

/* Actions */
.actions { display: flex; flex-direction: column; gap: 6px; }
.action-btn {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  border: 1px solid var(--panel-border);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
}
.action-btn:hover { background: rgba(255, 255, 255, 0.09); color: #fff; }
.action-btn.delete:hover { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }

/* Floating Action Button */
.fab {
  position: fixed;
  bottom: calc(70px + env(safe-area-inset-bottom, 0px));
  right: 22px;
  padding: 14px 22px;
  border-radius: 24px;
  background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
  color: #fff;
  border: none;
  font-family: inherit;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 8px 28px rgba(236, 72, 153, 0.45);
  backdrop-filter: blur(10px);
  z-index: 10;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.fab:active { transform: scale(0.94); }

/* Sheet Modal / Form */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(10px);
  z-index: 50;
  display: flex;
  align-items: flex-end;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-sheet {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  background: #11141a;
  border: 1px solid var(--panel-border);
  border-bottom: none;
  border-radius: 28px 28px 0 0;
  padding: 24px 20px calc(36px + env(safe-area-inset-bottom, 0px));
  max-height: 88vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.6);
}
.modal-overlay.active .modal-sheet { transform: translateY(0); }

.sheet-handle {
  width: 36px;
  height: 4px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 3px;
  margin: 0 auto 18px;
}
.sheet-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.sheet-title { font-size: 19px; font-weight: 800; color: #fff; }

/* Input Styling */
.form-group { margin-bottom: 14px; }
label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-dim);
  margin-bottom: 7px;
}
input, textarea, select {
  width: 100%;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 13px 15px;
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, background-color 0.2s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--accent-purple);
  background: rgba(255, 255, 255, 0.07);
}
.row-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Custom Image Upload Field */
.photo-uploader {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px;
  border-radius: 14px;
  border: 1px dashed rgba(255, 255, 255, 0.15);
  cursor: pointer;
  background: rgba(255, 255, 255, 0.02);
}
.photo-uploader img {
  width: 50px;
  height: 60px;
  border-radius: 8px;
  object-fit: cover;
}
.photo-uploader-text {
  font-size: 13px;
  color: var(--text-dim);
}

.submit-btn {
  width: 100%;
  padding: 15px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
  color: #fff;
  font-family: inherit;
  font-weight: 700;
  font-size: 15px;
  border: none;
  cursor: pointer;
  margin-top: 18px;
  box-shadow: 0 6px 20px rgba(236, 72, 153, 0.3);
  transition: transform 0.2s ease;
}
.submit-btn:active { transform: scale(0.98); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-icon { font-size: 42px; margin-bottom: 12px; opacity: 0.5; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<div class="app">
  <div class="top">
    <div class="brand-box">
      <div class="brand-icon">✨</div>
      <div>
        <h1>Remindr</h1>
        <div class="sub">Celestial Event Horizon</div>
      </div>
    </div>
    <button id="notify" class="icon-btn-top" title="Notification Permission">🔔</button>
  </div>

  <div class="nav-pill-container">
    <button id="birthTab" class="tab-btn active">Birthdays</button>
    <button id="progTab" class="tab-btn">Programs</button>
  </div>

  <div id="list"></div>
</div>

<button id="addBtn" class="fab">
  <span>＋</span>
  <span>New Entry</span>
</button>

<!-- Modal Sheet Form -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div id="title" class="sheet-title">Add Reminder</div>
      <button id="cancel" class="icon-btn-top" style="width:32px;height:32px;border-radius:50%;">✕</button>
    </div>

    <div id="bf">
      <div class="form-group">
        <label>Full Name</label>
        <input id="name" placeholder="E.g. Elena Rostova">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input id="dob" type="date">
      </div>
    </div>

    <div id="pf" class="hidden">
      <div class="form-group">
        <label>Event Name</label>
        <input id="pname" placeholder="E.g. Annual Gala, Keynote">
      </div>
      <div class="row-inputs form-group">
        <div>
          <label>Date</label>
          <input id="date" type="date">
        </div>
        <div>
          <label>Time</label>
          <input id="time" type="time">
        </div>
      </div>
      <div class="form-group">
        <label>Location</label>
        <input id="loc" placeholder="Optional venue / address">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="notes" placeholder="Optional notes or instructions..."></textarea>
      </div>
    </div>

    <div class="form-group">
      <label>Portrait / Graphic (Optional)</label>
      <div class="photo-uploader" onclick="$('photo').click()">
        <img id="preview" class="hidden">
        <div id="placeholderPreview" style="font-size: 24px; padding: 10px;">📸</div>
        <div class="photo-uploader-text" id="photoText">Click to select portrait image</div>
      </div>
      <input id="photo" type="file" accept="image/*" class="hidden">
    </div>

    <div class="form-group">
      <label>Trigger Alarm Ahead</label>
      <select id="rem">
        <option value="0">⚡ On the day (09:00 AM)</option>
        <option value="1">⏰ 1 day before</option>
        <option value="3">🗓️ 3 days before</option>
        <option value="7">🚀 7 days before</option>
      </select>
    </div>

    <button id="save" class="submit-btn">Save to Timeline</button>
  </div>
</div>

<script>
const KEY = "birthday_program_reminder_v2";
let data = JSON.parse(localStorage.getItem(KEY) || "[]");
let mode = "birthday", editing = null, photoData = "";

const $ = x => document.getElementById(x);
const esc = s => String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));

function db() { localStorage.setItem(KEY, JSON.stringify(data)); }

function age(d) {
  let b = new Date(d + "T00:00:00"), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() == b.getMonth() && n.getDate() < b.getDate())) a--;
  return a;
}

function next(d) {
  let n = new Date(), b = new Date(d + "T00:00:00");
  b.setFullYear(n.getFullYear());
  if (b < new Date(n.getFullYear(), n.getMonth(), n.getDate())) b.setFullYear(n.getFullYear() + 1);
  return b;
}

function left(d) {
  return Math.max(0, Math.ceil((d - new Date(new Date().setHours(0, 0, 0, 0))) / 86400000));
}

function fmt(d) {
  return new Date(d + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

function render() {
  closeModal();
  let a = data.filter(x => x.type === mode).sort((x, y) => {
    let dx = mode === "birthday" ? left(next(x.dob)) : left(new Date(x.date + "T" + (x.time || "00:00")));
    let dy = mode === "birthday" ? left(next(y.dob)) : left(new Date(y.date + "T" + (y.time || "00:00")));
    return dx - dy;
  });

  if (!a.length) {
    $("list").innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${mode === "birthday" ? "🎂" : "🪐"}</div>
        <div style="font-weight:700; color:#fff; margin-bottom:4px;">No upcoming ${mode}s</div>
        <div style="font-size:13px;">Tap "New Entry" below to track your first date.</div>
      </div>`;
    return;
  }

  $("list").innerHTML = a.map(e => {
    if (mode === "birthday") {
      const daysLeft = left(next(e.dob));
      const isToday = daysLeft === 0;
      return `
        <div class="card-entry">
          <div class="avatar-wrap">
            ${e.photo ? `<img src="${e.photo}">` : `<div class="avatar-placeholder">👤</div>`}
          </div>
          <div class="entry-info">
            <div class="entry-name">${esc(e.name)}</div>
            <div class="entry-meta">Born ${fmt(e.dob)} · Turning ${age(e.dob) + 1}</div>
            <div class="countdown-pill ${isToday ? 'today' : ''}">
              ${isToday ? '🎉 Celebrating Today!' : `⏳ ${daysLeft} days remaining`}
            </div>
          </div>
          <div class="actions">
            <button class="action-btn" onclick="edit('${e.id}')">✎</button>
            <button class="action-btn delete" onclick="delE('${e.id}')">✕</button>
          </div>
        </div>`;
    } else {
      const daysLeft = left(new Date(e.date + "T" + (e.time || "00:00")));
      const isToday = daysLeft === 0;
      return `
        <div class="card-entry">
          <div class="avatar-wrap">
            ${e.photo ? `<img src="${e.photo}">` : `<div class="avatar-placeholder">📅</div>`}
          </div>
          <div class="entry-info">
            <div class="entry-name">${esc(e.name)}</div>
            <div class="entry-meta">📍 ${e.loc ? esc(e.loc) : 'No location'} · ${fmt(e.date)} ${e.time || ''}</div>
            <div class="countdown-pill ${isToday ? 'today' : ''}">
              ${isToday ? '⚡ Happening Today' : `⏳ ${daysLeft} days left`}
            </div>
          </div>
          <div class="actions">
            <button class="action-btn" onclick="edit('${e.id}')">✎</button>
            <button class="action-btn delete" onclick="delE('${e.id}')">✕</button>
          </div>
        </div>`;
    }
  }).join("");
}

function openModal(t, e) {
  mode = t;
  editing = e?.id || null;
  photoData = e?.photo || "";
  
  $("bf").classList.toggle("hidden", t !== "birthday");
  $("pf").classList.toggle("hidden", t !== "program");
  $("title").textContent = e ? (t === "birthday" ? "Modify Birthday" : "Modify Program") : (t === "birthday" ? "New Birthday" : "New Program");
  
  $("name").value = e?.name || "";
  $("dob").value = e?.dob || "";
  $("pname").value = e?.name || "";
  $("date").value = e?.date || "";
  $("time").value = e?.time || "";
  $("loc").value = e?.loc || "";
  $("notes").value = e?.notes || "";
  $("rem").value = e?.reminder ?? 0;

  if (photoData) {
    $("preview").src = photoData;
    $("preview").classList.remove("hidden");
    $("placeholderPreview").classList.add("hidden");
    $("photoText").textContent = "Change current photo";
  } else {
    $("preview").classList.add("hidden");
    $("placeholderPreview").classList.remove("hidden");
    $("photoText").textContent = "Click to select portrait image";
  }

  $("modalOverlay").classList.add("active");
}

function closeModal() {
  $("modalOverlay").classList.remove("active");
}

function edit(id) {
  let e = data.find(x => x.id === id);
  openModal(e.type, e);
}

function delE(id) {
  if (confirm("Remove this entry permanently?")) {
    data = data.filter(x => x.id !== id);
    db();
    render();
  }
}

$("birthTab").onclick = () => {
  mode = "birthday";
  $("birthTab").classList.add("active");
  $("progTab").classList.remove("active");
  render();
};

$("progTab").onclick = () => {
  mode = "program";
  $("progTab").classList.add("active");
  $("birthTab").classList.remove("active");
  render();
};

$("addBtn").onclick = () => openModal(mode);
$("cancel").onclick = closeModal;
$("modalOverlay").onclick = e => { if (e.target === $("modalOverlay")) closeModal(); };

$("photo").onchange = e => {
  let f = e.target.files[0];
  if (!f) return;
  let r = new FileReader();
  r.onload = () => {
    photoData = r.result;
    $("preview").src = photoData;
    $("preview").classList.remove("hidden");
    $("placeholderPreview").classList.add("hidden");
    $("photoText").textContent = "Photo uploaded";
  };
  r.readAsDataURL(f);
};

$("save").onclick = () => {
  let e = data.find(x => x.id === editing) || { id: crypto.randomUUID(), type: mode };
  e.type = mode;
  e.name = mode === "birthday" ? $("name").value.trim() : $("pname").value.trim();
  
  if (!e.name) return alert("Please specify a name.");
  
  if (mode === "birthday") {
    e.dob = $("dob").value;
    if (!e.dob) return alert("Please select date of birth.");
  } else {
    e.date = $("date").value;
    e.time = $("time").value;
    if (!e.date) return alert("Please select date.");
    e.loc = $("loc").value.trim();
    e.notes = $("notes").value.trim();
  }
  
  e.photo = photoData;
  e.reminder = Number($("rem").value);

  if (!data.some(x => x.id === e.id)) data.push(e);
  db();
  render();
};

$("notify").onclick = async () => {
  if (window.AndroidReminder?.requestNotifications) {
    AndroidReminder.requestNotifications();
  } else if ("Notification" in window) {
    let p = await Notification.requestPermission();
    alert(p === "granted" ? "Live alerts activated." : "Permissions denied.");
  } else {
    alert("Run within the Android container for persistent alarms.");
  }
};

render();
</script>
</body>
</html>
